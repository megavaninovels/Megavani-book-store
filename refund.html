<h2>Cancellation & Refund Policy</h2>

<p>Orders can be cancelled only before dispatch.</p>

<p>Refunds are provided only if:</p>

<ul>
<li>You receive a damaged book.</li>
<li>You receive the wrong book.</li>
</ul>

<p>Refund requests must be made within 48 hours of delivery.</p>

<p>Approved refunds will be processed to the original payment method.</p>
