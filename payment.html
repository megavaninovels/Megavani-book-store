<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Payment | YAAN Publication</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <h2 class="mb-4">Payment</h2>

    <div class="row">

        <!-- Customer -->

        <div class="col-lg-8">

            <div class="card p-4 shadow-sm mb-4">

                <h4>Customer Details</h4>

                <hr>

                <p><strong>Name :</strong> <span id="customer-name"></span></p>

                <p><strong>Phone :</strong> <span id="customer-phone"></span></p>

                <p><strong>Email :</strong> <span id="customer-email"></span></p>

                <p><strong>Address :</strong> <span id="customer-address"></span></p>

            </div>

            <div class="card p-4 shadow-sm">

                <h4>Books</h4>

                <hr>

                <div id="book-list"></div>

            </div>

        </div>

        <!-- Summary -->

        <div class="col-lg-4">

            <div class="card p-4 shadow-sm">

                <h4>Payment Summary</h4>

                <hr>

                <div class="d-flex justify-content-between">

                    <span>Subtotal</span>

                    <strong id="subtotal">₹0</strong>

                </div>

                <div class="d-flex justify-content-between mt-2">

                    <span>Shipping</span>

                    <strong class="text-success">FREE</strong>

                </div>

                <hr>

                <div class="d-flex justify-content-between fs-5">

                    <strong>Total</strong>

                    <strong id="grand-total">₹0</strong>

                </div>

                <button
id="payNow"
class="btn btn-success w-100 mt-4">

Pay Now

</button>

            </div>

        </div>

    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module" src="js/payment.js"></script>
</body>

</html>
