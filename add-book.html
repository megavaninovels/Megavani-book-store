<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Add Book</h3>
        </div>

        <div class="card-body">

            <form id="bookForm">

                <div class="mb-3">
                    <label class="form-label">Book Title</label>
                    <input type="text" id="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Author</label>
                    <input type="text" id="author" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="description" rows="5" class="form-control"></textarea>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" id="price" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">MRP</label>
                        <input type="number" id="mrp" class="form-control">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category</label>

                        <select id="category" class="form-select">

                            <option>Romance</option>
                            <option>Crime</option>
                            <option>Thriller</option>
                            <option>Fantasy</option>
                            <option>Family</option>
                            <option>Historical</option>
                            <option>Horror</option>
                            <option>Science Fiction</option>
                            <option>Children</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Sub Category</label>
                        <input type="text" id="subcategory" class="form-control">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Language</label>

                        <select id="language" class="form-select">

                            <option>Tamil</option>
                            <option>English</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Pages</label>
                        <input type="number" id="pages" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Stock</label>
                        <input type="number" id="stock" class="form-control" value="100">
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Cover Image</label>

                    <input
                        type="text"
                        id="cover"
                        class="form-control"
                        placeholder="assets/books/book.jpg">

                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="featured">
                    <label class="form-check-label">Featured</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="bestseller">
                    <label class="form-check-label">Best Seller</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="newarrival">
                    <label class="form-check-label">New Arrival</label>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="published" checked>
                    <label class="form-check-label">Published</label>
                </div>

                <button class="btn btn-primary w-100" type="submit">

                    Save Book

                </button>

            </form>

        </div>

    </div>

</div>

<script type="module" src="js/add-book.js"></script>

</body>

</html>
